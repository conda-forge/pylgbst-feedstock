schema_version: 1

context:
  name: pylgbst
  version: "1.3.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/pylgbst-${{ version }}.tar.gz
  sha256: 42720acfa5347ff6ff800850fcda9614d4256acedccca183aabee6fe23de71bb

build:
  number: 2
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pylgbst
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"

about:
  summary: Python library to interact with LEGO PoweredUp devices (Lego BOOST etc.)
  license: MIT
  license_file:
    - LICENSE
  homepage: https://github.com/undera/pylgbst

extra:
  recipe-maintainers:
    - jan-janssen
